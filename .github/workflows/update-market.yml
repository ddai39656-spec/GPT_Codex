name: Refresh data and deploy terminal

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-market.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: terminal-data-pipeline
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate market data
        run: python scripts/update_market.py

      - name: Generate crypto data
        run: python scripts/update_crypto.py

      - name: Validate strict signal invariants
        run: python scripts/validate_data.py

      - name: Prepare deployment artifact
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          cp -r assets _site/
          base64 --decode --ignore-garbage assets/og.jpg.b64 > _site/assets/og.jpg
          rm _site/assets/og.jpg.b64
          cp data/market.json data/crypto.json _site/data/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Persist historical snapshots
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/crypto.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update terminal data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

