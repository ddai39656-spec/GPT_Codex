<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>多市场交易雷达</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--muted:#8ea0bd;--text:#edf3ff;--line:#263451;--good:#2dd4bf;--bad:#fb7185;--warn:#fbbf24;--blue:#60a5fa}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}.title{font-size:26px;font-weight:800}.sub{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid var(--line);background:#0e1628;color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer}.tab.active{border-color:var(--blue);background:#172443}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}.panel h3{margin:0 0 12px;font-size:16px}.status{padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-weight:800}.status.good{border-color:var(--good);color:var(--good)}.status.silent{color:var(--warn)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #202d47;white-space:nowrap}th{color:var(--muted);font-weight:600}.scroll{overflow:auto}.pill{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.card{background:#0e1628;border:1px solid var(--line);border-radius:12px;padding:11px}.card b{display:block;font-size:19px;margin-top:4px}.events{display:grid;gap:9px}.event{border:1px solid var(--line);border-radius:11px;padding:10px}.event .meta{color:var(--muted);font-size:12px;margin-top:5px}@media(max-width:980px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div class="title">多市场交易雷达</div><div class="sub">Crypto · 美股 · A股 · 事件驱动 · 严格执行策略</div></div><div class="sub" id="updated">等待数据…</div></div>
<div class="tabs"><button class="tab active" data-tab="crypto">🪙 加密币</button><button class="tab" data-tab="us">🇺🇸 美股</button><button class="tab" data-tab="cn">🇨🇳 A股</button><button class="tab" data-tab="events">🧭 事件雷达</button></div>
<section id="crypto" class="section">
<div class="cards"><div class="card">扫描链<b>Solana / Base / ETH</b></div><div class="card">策略状态<b id="cryptoStatus">严格静默</b></div><div class="card">当前候选<b id="cryptoCount">0</b></div><div class="card">刷新频率<b>30 秒</b></div></div>
<div class="grid"><div class="panel"><h3>加密币扫描结果</h3><div class="scroll"><table><thead><tr><th>币</th><th>链</th><th>价格</th><th>FDV</th><th>流动性</th><th>5m</th><th>1h</th><th>24h量</th><th>CA</th></tr></thead><tbody id="cryptoRows"></tbody></table></div></div>
<div class="panel"><h3>【必须买｜可立即执行】硬条件</h3><div id="hardStatus" class="status silent">本轮未出现全条件通过标的 → 静默</div><div id="checks" style="margin-top:12px" class="muted">CA/主池、安全、LP、5m+15m净买、1h资金改善、结构确认、无否决信号、执行价与2×空间，必须全部通过。</div></div></div></section>
<section id="us" class="section" hidden><div class="panel"><h3>美股活跃标的</h3><div class="scroll"><table><thead><tr><th>Ticker</th><th>公司</th><th>价格</th><th>1日</th><th>5日</th><th>量比</th><th>RSI14</th><th>技术状态</th></tr></thead><tbody id="usRows"></tbody></table></div></div></section>
<section id="cn" class="section" hidden><div class="panel"><h3>A股活跃标的</h3><div class="scroll"><table><thead><tr><th>代码</th><th>名称</th><th>价格</th><th>涨跌</th><th>成交额</th><th>量比</th><th>换手</th><th>5分钟</th></tr></thead><tbody id="cnRows"></tbody></table></div></div></section>
<section id="events" class="section" hidden><div class="panel"><h3>近期价格影响信息</h3><div class="events" id="eventRows"></div></div></section>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.section').forEach(x=>x.hidden=true);$('#'+b.dataset.tab).hidden=false});
const fmt=n=>{n=Number(n||0);if(!Number.isFinite(n))return'-';if(Math.abs(n)>=1e9)return(n/1e9).toFixed(2)+'B';if(Math.abs(n)>=1e6)return(n/1e6).toFixed(2)+'M';if(Math.abs(n)>=1e3)return(n/1e3).toFixed(1)+'K';return n.toLocaleString()};
const pct=n=>`${Number(n||0)>=0?'+':''}${Number(n||0).toFixed(2)}%`;
async function loadStatic(){try{const r=await fetch('data/market.json?'+Date.now());const d=await r.json();$('#updated').textContent='数据更新时间：'+(d.updated_at||'-');$('#usRows').innerHTML=(d.us||[]).map(x=>`<tr><td>${x.ticker}</td><td>${x.name||''}</td><td>${x.price??'-'}</td><td class="${x.d1>=0?'good':'bad'}">${pct(x.d1)}</td><td class="${x.d5>=0?'good':'bad'}">${pct(x.d5)}</td><td>${x.volume_ratio??'-'}</td><td>${x.rsi14??'-'}</td><td>${x.signal||'-'}</td></tr>`).join('');$('#cnRows').innerHTML=(d.cn||[]).map(x=>`<tr><td>${x.code}</td><td>${x.name}</td><td>${x.price}</td><td class="${x.change_pct>=0?'good':'bad'}">${pct(x.change_pct)}</td><td>${fmt(x.amount)}</td><td>${x.volume_ratio??'-'}</td><td>${x.turnover??'-'}%</td><td class="${x.m5>=0?'good':'bad'}">${pct(x.m5)}</td></tr>`).join('');$('#eventRows').innerHTML=(d.events||[]).map(e=>`<div class="event"><span class="pill ${e.bias==='偏利多'?'good':e.bias==='偏利空'?'bad':'warn'}">${e.bias}</span> <b>${e.symbol||''} ${e.title||''}</b><div class="meta">${e.market||''} · 影响 ${e.impact||'待评估'} · ${e.horizon||''} · ${e.time||''}</div><div style="margin-top:6px">${e.reason||''}</div></div>`).join('')||'<div class="muted">暂无事件数据</div>'}catch(e){$('#updated').textContent='静态数据暂不可用'}}
async function loadCrypto(){try{const r=await fetch('https://api.dexscreener.com/token-boosts/top/v1');const boosts=await r.json();const selected=(boosts||[]).filter(x=>['solana','base','ethereum'].includes(x.chainId)).slice(0,18);let rows=[];for(const x of selected.slice(0,10)){try{const q=await fetch(`https://api.dexscreener.com/latest/dex/tokens/${x.tokenAddress}`);const j=await q.json();const p=(j.pairs||[]).sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0))[0];if(p)rows.push(p)}catch{}}$('#cryptoCount').textContent=rows.length;$('#cryptoRows').innerHTML=rows.map(p=>`<tr><td><b>${p.baseToken?.symbol||'-'}</b></td><td>${p.chainId}</td><td>${p.priceUsd||'-'}</td><td>${fmt(p.fdv)}</td><td>${fmt(p.liquidity?.usd)}</td><td class="${(p.priceChange?.m5||0)>=0?'good':'bad'}">${pct(p.priceChange?.m5)}</td><td class="${(p.priceChange?.h1||0)>=0?'good':'bad'}">${pct(p.priceChange?.h1)}</td><td>${fmt(p.volume?.h24)}</td><td title="${p.baseToken?.address||''}">${(p.baseToken?.address||'').slice(0,7)}…</td></tr>`).join('');$('#cryptoStatus').textContent='严格静默';$('#hardStatus').className='status silent';$('#hardStatus').textContent='未完成全部安全/资金/结构核验 → 不触发【必须买】'}catch(e){$('#cryptoRows').innerHTML='<tr><td colspan="9" class="muted">DEX 数据暂不可用</td></tr>'}}
loadStatic();loadCrypto();setInterval(loadCrypto,30000);setInterval(loadStatic,300000);
</script></body></html>
